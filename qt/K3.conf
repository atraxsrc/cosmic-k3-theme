# K3 colour scheme for qt5ct / qt6ct, part of cosmic-k3-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> K3, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#cacccc, #212121, #4b4e55, #343d41, #0c0e10, #2c2c2d, #cacccc, #d5d5d5, #cacccc, #0c0e10, #101315, #0c0e10, #798186, #101315, #798186, #798186, #212121, #101315, #212121, #cacccc, #7f7f7f
disabled_colors=#565d60, #212121, #4b4e55, #343d41, #0c0e10, #2c2c2d, #565d60, #949494, #565d60, #101315, #101315, #0c0e10, #4b4e55, #949494, #7f7f7f, #7f7f7f, #212121, #101315, #212121, #cacccc, #4b4e55
inactive_colors=#cacccc, #212121, #4b4e55, #343d41, #0c0e10, #2c2c2d, #cacccc, #d5d5d5, #cacccc, #0c0e10, #101315, #0c0e10, #798186, #101315, #798186, #798186, #212121, #101315, #212121, #cacccc, #7f7f7f
