# K3 for lazygit, part of cosmic-k3-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/k3.yml and
# zsh/k3.zsh sets LG_CONFIG_FILE to "config.yml,k3.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/k3.yml"
gui:
  theme:
    activeBorderColor:
      - "#798186"
      - bold
    inactiveBorderColor:
      - "#4B4E55"
    searchingActiveBorderColor:
      - "#D87C4A"
      - bold
    optionsTextColor:
      - "#949494"
    selectedLineBgColor:
      - "#2C2C2D"
    inactiveViewSelectedLineBgColor:
      - "#212121"
    cherryPickedCommitFgColor:
      - "#101315"
    cherryPickedCommitBgColor:
      - "#C9C2B4"
    markedBaseCommitFgColor:
      - "#101315"
    markedBaseCommitBgColor:
      - "#9FA5A9"
    unstagedChangesColor:
      - "#DE6145"
    defaultFgColor:
      - "#CACCCC"
  authorColors:
    "*": "#C9C2B4"
