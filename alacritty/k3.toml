# K3 for Alacritty, part of cosmic-k3-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./alacritty/install.sh puts this in ~/.config/alacritty/themes/,
# then in ~/.config/alacritty/alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/k3.toml"]
# (Alacritty 0.13: a top-level `import = [...]` line instead.)

[colors.primary]
background = "#101315"
foreground = "#CACCCC"
bright_foreground = "#D5D5D5"
dim_foreground = "#7F7F7F"

[colors.cursor]
text = "#101315"
cursor = "#798186"

[colors.vi_mode_cursor]
text = "#101315"
cursor = "#D87C4A"

[colors.selection]
text = "CellForeground"
background = "#343D41"

[colors.search.matches]
foreground = "#101315"
background = "#C9C2B4"

[colors.search.focused_match]
foreground = "#101315"
background = "#798186"

[colors.hints.start]
foreground = "#101315"
background = "#D87C4A"

[colors.hints.end]
foreground = "#101315"
background = "#C9C2B4"

[colors.footer_bar]
foreground = "#CACCCC"
background = "#212121"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.normal]
black   = "#0C0E10"
red     = "#DE6145"
green   = "#9FA5A9"
yellow  = "#C9C2B4"
blue    = "#798186"
magenta = "#D87C4A"
cyan    = "#707070"
white   = "#CBC2BE"

[colors.bright]
black   = "#4B4E55"
red     = "#E8836C"
green   = "#B5BABD"
yellow  = "#D9DBDC"
blue    = "#A8ADB0"
magenta = "#E39A72"
cyan    = "#949494"
white   = "#D5D5D5"

[colors.dim]
black   = "#101315"
red     = "#A64934"
green   = "#767B7E"
yellow  = "#968F85"
blue    = "#5D6367"
magenta = "#A25D38"
cyan    = "#545454"
white   = "#949494"
